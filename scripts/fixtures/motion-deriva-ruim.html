<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Pedidos em separação</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/20px Arial,sans-serif;color:#111827;background:#f9fafb}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid #d1d5db;background:#fff}
h1{font-size:18px;line-height:24px;margin:0}
button{font:inherit;height:36px;padding:0 14px;border:1px solid #6b7280;border-radius:6px;background:#fff;color:#111827}
main{position:relative;padding:24px 24px 0;max-width:640px}
.resumo{position:absolute;left:24px;right:24px;top:24px;height:56px;padding:16px;border-radius:8px;background:#dbeafe;opacity:0;transition:opacity 200ms ease}
.cartao{height:72px;margin-bottom:12px;padding:12px 16px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
.cartao strong{display:block}
/* Seeded defect: the cards make room on three different durations, so the gaps between them wobble. */
.cartao:nth-of-type(2){transition:transform 200ms ease}
.cartao:nth-of-type(3){transition:transform 320ms ease}
.cartao:nth-of-type(4){transition:transform 260ms ease}
.aberto .resumo{opacity:1}
.aberto .cartao{transform:translateY(68px)}
</style></head>
<body>
<header><h1>Pedidos em separação</h1><button type="button" id="acionar">Mostrar resumo</button></header>
<main id="area">
  <div class="resumo">3 pedidos · 41 itens · previsão 14h30</div>
  <div class="cartao"><strong>Pedido 88210</strong>Mercado Bom Preço · 12 itens</div>
  <div class="cartao"><strong>Pedido 88214</strong>Farmácia Vida · 9 itens</div>
  <div class="cartao"><strong>Pedido 88219</strong>Papelaria Central · 20 itens</div>
</main>
<script>
document.getElementById('acionar').addEventListener('click', () => {
  document.getElementById('area').classList.add('aberto');
});
</script>
</body></html>
