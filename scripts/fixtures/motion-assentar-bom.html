<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cadastro de fornecedor</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/20px Arial,sans-serif;color:#111827;background:#fff}
header{padding:12px 24px;border-bottom:1px solid #d1d5db}
h1{font-size:18px;line-height:24px;margin:0}
main{padding:24px;max-width:560px}
label{display:block;margin-bottom:12px}
input{display:block;width:100%;height:36px;margin-top:4px;padding:0 10px;border:1px solid #9ca3af;border-radius:6px;font:inherit}
button{font:inherit;height:36px;padding:0 14px;border:1px solid #1d4ed8;border-radius:6px;background:#1d4ed8;color:#fff}
.aviso{position:fixed;right:24px;bottom:24px;width:320px;padding:12px 16px;border-radius:8px;background:#111827;color:#fff;animation:sobe 200ms ease-out}
@keyframes sobe{from{opacity:0;transform:translateY(12px)}}
</style></head>
<body>
<header><h1>Cadastro de fornecedor</h1></header>
<main>
  <label>Razão social <input value="Transportes Vale Verde Ltda."></label>
  <label>CNPJ <input value="12.345.678/0001-90"></label>
  <label>E-mail financeiro <input value="financeiro@valeverde.example"></label>
  <button type="button" id="acionar">Salvar alterações</button>
</main>
<script>
// Fix: the entrance ends exactly where the toast stays; nothing moves after it lands.
document.getElementById('acionar').addEventListener('click', () => {
  const aviso = document.createElement('div');
  aviso.className = 'aviso';
  aviso.setAttribute('role', 'status');
  aviso.textContent = 'Fornecedor salvo';
  document.body.append(aviso);
});
</script>
</body></html>
