<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Chamado 4821</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/20px Arial,sans-serif;color:#111827;background:#f3f4f6}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #d1d5db}
h1{font-size:18px;line-height:24px;margin:0}
main{padding:24px;max-width:720px}
.card{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;line-height:24px;margin:0 0 8px}
.card p{margin:0 0 8px}
button{font:inherit;padding:8px 14px;border:1px solid #6b7280;border-radius:6px;background:#fff;color:#111827}
.primario{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
/* Seeded defect: the Comentar button sits 4px under the textarea. */
textarea{display:block;width:100%;height:96px;font:inherit;padding:8px;border:1px solid #6b7280;border-radius:6px}
.enviar{margin-top:4px}
</style></head>
<body>
<header>
  <h1>Chamado 4821</h1>
  <button type="button" class="primario">Encerrar chamado</button>
</header>
<main>
  <section class="card">
    <h2>Histórico</h2>
    <p>Cliente relata cobrança duplicada na fatura de outubro.</p>
    <p>Financeiro confirmou o estorno em 06/11/2026.</p>
  </section>
  <section class="card">
    <h2>Novo comentário</h2>
    <label for="c">Comentário interno</label>
    <textarea id="c">Estorno confirmado, aguardar compensação.</textarea>
    <button type="button" class="primario enviar">Comentar</button>
  </section>
</main>
</body></html>
