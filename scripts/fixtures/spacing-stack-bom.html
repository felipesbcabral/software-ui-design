<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Fornecedores</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/20px Arial,sans-serif;color:#111827;background:#f3f4f6}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #d1d5db}
h1{font-size:18px;line-height:24px;margin:0}
main{padding:24px;max-width:720px}
.card{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;line-height:24px;margin:0 0 8px}
.card p{margin:0 0 8px}
button{font:inherit;padding:8px 14px;border:1px solid #6b7280;border-radius:6px;background:#fff;color:#111827}
.primario{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
/* Fix: 1.3 line height plus a 2px gap, about 6px of ink between the lines. */
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid #e5e7eb}
.nome{font-weight:700;line-height:18px;margin-bottom:2px}
.cidade{font-size:12px;line-height:16px;color:#4b5563}
</style></head>
<body>
<header>
  <h1>Fornecedores</h1>
  <button type="button" class="primario">Novo fornecedor</button>
</header>
<main>
  <section class="card">
    <h2>Ativos</h2>
    <ul class="lista">
      <li><div><div class="nome">Atacadão Bom Preço</div><div class="cidade">Campinas, SP</div></div></li>
      <li><div><div class="nome">Embalagens Rio Claro</div><div class="cidade">Rio Claro, SP</div></div></li>
      <li><div><div class="nome">Laticínios Serra Azul</div><div class="cidade">Poços de Caldas, MG</div></div></li>
    </ul>
  </section>
</main>
</body></html>
