<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Painel do escritório</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/20px Arial,sans-serif;color:#111827;background:#fff;display:flex;min-height:100vh}
aside{width:240px;border-right:1px solid #d1d5db;padding:16px 12px}
aside ul{list-style:none;margin:0;padding:0}
aside a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;color:#111827;text-decoration:none}
aside a:hover{background:#f3f4f6}
svg{width:20px;height:20px;flex:none}
main{flex:1;padding:24px}
h1{font-size:18px;line-height:24px;margin:0 0 12px}
</style></head>
<body>
<aside>
  <nav aria-label="Principal">
    <ul>
      <!-- Drawn icons from one outline set, tinted with the text color. -->
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>Início</a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Notas fiscais</a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Clientes</a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Relatórios</a></li>
    </ul>
  </nav>
</aside>
<main>
  <h1>Início</h1>
  <p>Há 5 tarefas vencendo nesta semana e 1 nota recusada pela prefeitura.</p>
</main>
</body></html>
