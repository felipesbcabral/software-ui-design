<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Equipe</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/20px Arial,sans-serif;color:#111827;background:#f3f4f6}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #d1d5db}
h1{font-size:18px;line-height:24px;margin:0}
main{padding:24px;max-width:720px}
.card{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;line-height:24px;margin:0 0 8px}
.card p{margin:0 0 8px}
button{font:inherit;padding:8px 14px;border:1px solid #6b7280;border-radius:6px;background:#fff;color:#111827}
.primario{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
/* Fix: the avatar keeps its size (flex: none) and the e-mail truncates (min-width: 0). */
.pessoa{display:flex;gap:12px;align-items:center;width:300px}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;background:#dbeafe;color:#1e3a8a;display:grid;place-items:center;font-size:12px}
.email{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head>
<body>
<header>
  <h1>Equipe</h1>
  <button type="button" class="primario">Convidar pessoa</button>
</header>
<main>
  <section class="card">
    <h2>Financeiro</h2>
    <div class="pessoa">
      <span class="avatar">AB</span>
      <span class="email">financeiro.departamento.regional@exemplo.com.br</span>
    </div>
  </section>
</main>
</body></html>
